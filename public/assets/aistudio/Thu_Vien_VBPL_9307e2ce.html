const demo={id:'huong-dan',code:'HƯỚNG DẪN',type:'Tài liệu',title:'Sử dụng thư viện văn bản',category:'Hướng dẫn sử dụng',sample:true,source:'',text:'Chương I. Bắt đầu sử dụng\nĐiều 1. Tra cứu văn bản\nChọn lĩnh vực ở cột trái, sau đó chọn văn bản ở cột giữa. Nhập từ khóa hoặc số hiệu vào ô tìm kiếm để tìm trong toàn bộ tài liệu đã có trong trình duyệt.\nTìm kiếm mặc định không phân biệt dấu tiếng Việt. Bật “Khớp dấu tiếng Việt” để thu hẹp kết quả. Bộ lọc loại văn bản và nội dung được áp dụng đồng thời.\nĐiều 2. Đọc và đánh dấu\nMục lục được dựng từ các dòng bắt đầu bằng Phần, Chương, Mục hoặc Điều. Nhấn vào mục để chuyển đến vị trí tương ứng.\nNhấn biểu tượng lá cờ để đánh dấu văn bản. Ghi chú ở cuối văn bản được lưu khi bấm “Lưu ghi chú”. Xem thêm Điều 4 để sao lưu dữ liệu.\nChương II. Quản lý dữ liệu\nĐiều 3. Nạp tài liệu\nBấm Nạp văn bản. Chọn tệp TXT, MD hoặc HTML, kiểm tra tên, số hiệu và lĩnh vực trước khi lưu. HTML được chuyển thành văn bản thuần; hình ảnh, bảng và định dạng gốc không được giữ nguyên.\nBạn cũng có thể dán nội dung được trích xuất từ Word hoặc PDF. Bản này chưa đọc trực tiếp DOCX, PDF scan và chưa có OCR. Không có chức năng xác nhận hiệu lực pháp luật.\nĐiều 4. Sao lưu và khôi phục\nDùng Xuất dữ liệu để tải bản JSON gồm văn bản, đánh dấu, ghi chú và lịch sử thao tác. Để khôi phục, chọn Nhập bản sao lưu JSON trong cùng hộp thoại.\nNhập bản sao lưu sẽ bổ sung các văn bản chưa có ID, giữ các văn bản trùng ID đang lưu trên máy. Nên xuất sao lưu trước khi chuyển trình duyệt hoặc dọn dữ liệu.\nĐiều 5. Kiểm chứng trước khi sử dụng\nCác thẻ số hiệu ban đầu chỉ tham chiếu giao diện mẫu, chưa được đối chiếu với nguồn chính thức và chưa có toàn văn. Nhãn này không xác nhận sự tồn tại, nội dung hay hiệu lực của văn bản.\nTài liệu này là hướng dẫn sử dụng phần mềm, không phải văn bản pháp luật. Người dùng cần tự kiểm tra nội dung đã nạp với bản gốc.'};
function fresh(){return {version:1,docs:[...refs.map((r,i)=>({id:'ref-'+i,code:r[0],type:r[1],title:r[2],category:'Xây dựng',sample:true,source:'https://thuvien-vbpl-26.web.app/',text:''})),demo],bookmarks:[],notes:{},recent:[],logs:[],theme:'light',fontSize:16,serif:false}}
function validDoc(d){return d&&typeof d.id==='string'&&d.id.length<200&&typeof d.title==='string'&&typeof d.text==='string'&&typeof d.category==='string'&&typeof d.code==='string'&&typeof d.type==='string'}
function sanitizeState(raw){if(!raw||!Array.isArray(raw.docs)||!raw.docs.every(validDoc))throw Error('Dữ liệu không đúng cấu trúc.');return {...fresh(),docs:raw.docs.map(d=>({...d,source:safeUrl(d.source),sample:d.sample===true})),bookmarks:Array.isArray(raw.bookmarks)?raw.bookmarks.filter(x=>typeof x==='string'):[],notes:raw.notes&&typeof raw.notes==='object'&&!Array.isArray(raw.notes)?raw.notes:{},recent:Array.isArray(raw.recent)?raw.recent.filter(x=>typeof x==='string'):[],logs:Array.isArray(raw.logs)?raw.logs.slice(-1000):[],theme:raw.theme==='dark'?'dark':'light',fontSize:Math.max(13,Math.min(24,Number(raw.fontSize)||16)),serif:raw.serif===true}}
function safeUrl(u){try{const x=new URL(u);return ['https:','http:'].includes(x.protocol)?x.href:''}catch{return ''}}
let state,loadFailed=false;try{const seed=JSON.parse($('#seed').textContent);const saved=localStorage.getItem(KEY);state=saved?sanitizeState(JSON.parse(saved)):seed?sanitizeState(seed):fresh()}catch{state=fresh();loadFailed=true}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){s=String(s).toLowerCase();return $('#accent').checked?s:s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d')}

function save(action,id){if(action)state.logs.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),at:new Date().toISOString(),action,documentId:id||null});state.logs=state.logs.slice(-1000);try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{$('#storageStatus').textContent='Không lưu được vào trình duyệt · Hãy xuất sao lưu';toast('Không lưu được dữ liệu. Hãy xuất bản sao lưu trước khi đóng trang.');return false}}

function allGroups(){const arr=groups.map(([g,c])=>[g,[...c]]);const known=arr.flatMap(x=>x[1]);const extra=[...new Set(state.docs.map(d=>d.category))].filter(c=>!known.includes(c));if(extra.length)arr.push(['Tài liệu đã nạp',extra]);return arr}
function renderCategories(){const filter=norm($('#categoryFilter').value);$('#categories').innerHTML=allGroups().filter(([g,cs])=>norm(g+' '+cs.join(' ')).includes(filter)).map(([g,cs])=>{const active=cs.includes(category),count=state.docs.filter(d=>cs.includes(d.category)).length;return `<details class="group ${active?'active':''}" ${active||filter?'open':''}><summary><span class="folder">▣</span>${esc(g)}<span class="count">${count}</span></summary><div class="subcat">${cs.map(c=>`<button data-category="${esc(c)}" class="${category===c?'selected':''}"><span>▧</span>${esc(c)}<span class="count">${state.docs.filter(d=>d.category===c).length}</span></button>`).join('')}</div></details>`}).join('');$$('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;view='docs';$('#search').value='';renderCategories();renderList();mobile('list')})}
function filtered(){const q=norm($('#search').value.trim()),type=$('#typeFilter').value,st=$('#statusFilter').value;let docs=state.docs.filter(d=>(view==='results'||category===null||['bookmarks','recent'].includes(view)||d.category===category)&&(!type||d.type===type)&&(!st||(st==='full'?!!d.text:!d.text))&&(!q||norm(d.code+' '+d.title+' '+d.text).includes(q)));if(view==='bookmarks')docs=docs.filter(d=>state.bookmarks.includes(d.id));if(view==='recent')docs=state.recent.map(id=>docs.find(d=>d.id===id)).filter(Boolean);return docs}
function renderList(){$$('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===view);b.setAttribute('aria-selected',b.dataset.tab===view)});const docs=filtered();$('#resultCount').textContent=docs.length+' văn bản';$('#catalogFoot').textContent=state.docs.length+' văn bản trong thư viện · '+state.bookmarks.length+' đánh dấu';$('#docList').innerHTML=`<div class="list-caption">${esc(view==='results'?'Kết quả toàn thư viện':view==='bookmarks'?'Văn bản đã đánh dấu':view==='recent'?'Đã mở gần đây':category||'Toàn bộ lĩnh vực')}</div>`+(docs.length?docs.map(d=>`<button class="doc-card ${current===d.id?'active':''}" data-doc="${esc(d.id)}"><span class="card-top"><span class="badge ${d.type==='Luật'?'luat':d.type==='Thông tư'?'tt':d.type==='Tài liệu'?'demo':''}">${esc(d.type.toUpperCase())}</span><span class="doc-code">${esc(d.code||'Chưa có số hiệu')}</span>${state.bookmarks.includes(d.id)?'<span class="card-star">⚑</span>':''}</span><div class="doc-title">${esc(d.title)}</div><div class="doc-status">${d.sample?(d.text?'Tài liệu hướng dẫn · Minh họa':'Danh mục mẫu · Chưa xác minh'):'Do người dùng nạp · Chưa xác minh'}</div></button>`).join(''):'<div class="empty"><strong>Chưa có văn bản phù hợp</strong>Đổi bộ lọc hoặc nạp thêm tài liệu.<br><br><button id="resetFilters">Xóa bộ lọc</button></div>');$$('[data-doc]').forEach(b=>b.onclick=()=>openDoc(b.dataset.doc));if($('#resetFilters'))$('#resetFilters').onclick=()=>{$('#search').value='';$('#typeFilter').value='';$('#statusFilter').value='';category=null;view='docs';renderCategories();renderList()}}
function welcome(){$('#readerBody').innerHTML=`<div class="welcome"><div class="welcome-symbol">⚖</div><div class="overline">KHÔNG GIAN TRA CỨU CỦA BẠN</div><h1>Thư viện văn bản<br>quy phạm pháp luật</h1><p>Hệ thống hóa tài liệu. Tìm đúng nội dung.<br>Đọc, đánh dấu và ghi chú trong một không gian thống nhất.</p><div class="steps"><div class="step"><em>01 / PHÂN LOẠI</em><b>Chọn lĩnh vực</b><span>Duyệt cây lĩnh vực<br>ở cột bên trái.</span></div><div class="step"><em>02 / TRA CỨU</em><b>Chọn văn bản</b><span>Tìm theo số hiệu,<br>tên hoặc nội dung.</span></div><div class="step"><em>03 / KHAI THÁC</em><b>Đọc từng mục</b><span>Di chuyển theo mục lục,<br>đánh dấu và ghi chú.</span></div></div><div class="welcome-actions"><button class="btn-primary" id="startImport">＋ Nạp tài liệu của bạn</button><button id="startGuide">Mở tài liệu hướng dẫn ↗</button></div><div class="note-banner"><strong>Về dữ liệu hiện có</strong><br>Danh mục số hiệu được dựng theo giao diện tham khảo, chưa xác minh và chưa nạp toàn văn. Chỉ dùng để trải nghiệm bố cục; không dùng làm căn cứ pháp lý.</div></div>`;$('#startImport').onclick=showImport;$('#startGuide').onclick=()=>openDoc('huong-dan')}
function sections(text){return text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map((line,i)=>({line,i,heading:/^(Phần\s+\S+|Chương\s+\S+|Mục\s+\d+|Điều\s+\d+[.\s:])/i.test(line)}))}
function lineHtml(line,sec){let out='',last=0;const re=/Điều\s+(\d+)/g;let match;while((match=re.exec(line))){out+=esc(line.slice(last,match.index));const target=sec.find(s=>s.heading&&new RegExp('^Điều\\s+'+match[1]+'(?:[.\\s:]|$)','i').test(s.line));out+=target?`<a href="#sec-${target.i}">${esc(match[0])}</a>`:esc(match[0]);last=match.index+match[0].length}return out+esc(line.slice(last))}
function openDoc(id){const d=state.docs.find(d=>d.id===id);if(!d)return;current=id;state.recent=[id,...state.recent.filter(x=>x!==id)].slice(0,30);save('MỞ_VĂN_BẢN',id);$('#readerTitle').textContent=d.code+' · '+d.title;$('#bookmark').disabled=false;$('#copy').disabled=false;$('#readerStatus').textContent=d.category+' · '+(d.text?'Có nội dung':'Chưa nạp toàn văn');const sec=sections(d.text),heads=sec.filter(s=>s.heading);$('#readerBody').innerHTML=`<article class="article"><div class="crumb">THƯ VIỆN &nbsp; / &nbsp; ${esc(d.category.toUpperCase())}</div><span class="badge ${d.type==='Luật'?'luat':d.type==='Thông tư'?'tt':'demo'}">${esc(d.type.toUpperCase())}</span><h1>${esc(d.title)}</h1><div class="metadata"><span>Số hiệu: <b>${esc(d.code||'Chưa xác định')}</b></span><span>Trạng thái: <b>Chưa xác minh pháp lý</b></span></div><div class="disclaimer">${d.sample?(d.text?'Tài liệu minh họa chức năng, không phải nội dung pháp luật.':'Danh mục tham chiếu giao diện mẫu. Chưa kiểm chứng số hiệu, trích yếu, ngày ban hành hoặc hiệu lực; chưa có toàn văn. Tiêu đề hiển thị có thể được rút gọn.'): 'Tài liệu do người dùng nạp. Cần đối chiếu với bản gốc trước khi sử dụng.'}</div>${d.source?`<p style="font-size:12px"><a href="${esc(safeUrl(d.source))}" target="_blank" rel="noopener noreferrer">${d.sample?'Mở trang tham khảo giao diện':'Mở liên kết nguồn do người dùng cung cấp'} ↗</a></p>`:''}<div class="toc" id="toc"><strong>☷ &nbsp; MỤC LỤC</strong>${heads.length?heads.map(s=>`<a href="#sec-${s.i}">${esc(s.line)}</a>`).join(''):'<span style="font-size:12px;color:var(--muted)">'+(d.text?'Chưa nhận diện được tiêu đề Phần, Chương, Mục hoặc Điều.':'Chưa có nội dung để tạo mục lục.')+'</span>'}</div>${d.text?sec.map(s=>s.heading?`<section id="sec-${s.i}"><${/^Điều/i.test(s.line)?'h3':'h2'}>${esc(s.line)}</${/^Điều/i.test(s.line)?'h3':'h2'}></section>`:`<p>${lineHtml(s.line,sec)}</p>`).join(''):'<div class="empty"><strong>Nội dung đang chờ bổ sung</strong>Nạp tài liệu của bạn để sử dụng tìm kiếm toàn văn và mục lục.<br><br><button id="addFromDoc" class="btn-primary">＋ Nạp tài liệu</button></div>'}<div class="annotation"><label for="docNote">✎ Ghi chú của bạn</label><textarea id="docNote" placeholder="Ghi lại nội dung cần đối chiếu, vấn đề cần theo dõi…">${esc(typeof state.notes[id]==='string'?state.notes[id]:'')}</textarea><small>Ghi chú được lưu riêng trong trình duyệt hiện tại.</small><button id="saveNote">Lưu ghi chú</button></div></article>`;$('#saveNote').onclick=()=>{state.notes[id]=$('#docNote').value;if(save('LƯU_GHI_CHÚ',id))toast('Đã lưu ghi chú.')};if($('#addFromDoc'))$('#addFromDoc').onclick=showImport;$('#readScroll').scrollTop=0;syncBookmark();renderList();mobile('reader')}
function syncBookmark(){const on=state.bookmarks.includes(current);$('#bookmark').style.color=on?'#b38e2d':'';$('#bookmark').setAttribute('aria-pressed',on);$('#bookmark').title=on?'Bỏ đánh dấu văn bản':'Đánh dấu văn bản (D)'}
function toggleBookmark(){if(!current)return;const on=state.bookmarks.includes(current);state.bookmarks=on?state.bookmarks.filter(x=>x!==current):[...state.bookmarks,current];const ok=save(on?'BỎ_ĐÁNH_DẤU':'ĐÁNH_DẤU',current);syncBookmark();renderList();if(ok)toast(on?'Đã bỏ đánh dấu.':'Đã đánh dấu văn bản.')}
function showModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;if(!$('#modal').open)$('#modal').showModal()}
function showImport(){showModal('Nạp văn bản',`<p>Nạp TXT, MD hoặc HTML; hoặc dán nội dung. Nội dung HTML được chuyển thành văn bản thuần. Chưa hỗ trợ đọc trực tiếp Word/PDF/OCR.</p><input type="file" id="sourceFile" accept=".txt,.md,.html,.htm,text/plain,text/html" aria-label="Chọn tài liệu"><label for="newTitle">Tên văn bản *</label><input id="newTitle" placeholder="Nhập tên văn bản"><label for="newCode">Số hiệu / mã tài liệu</label><input id="newCode" placeholder="Chưa xác định"><label for="newType">Loại văn bản</label><select id="newType"><option>Tài liệu</option><option>Luật</option><option>Nghị định</option><option>Thông tư</option></select><label for="newCategory">Lĩnh vực</label><select id="newCategory">${allGroups().flatMap(x=>x[1]).map(c=>`<option ${c===category?'selected':''}>${esc(c)}</option>`).join('')}</select><label for="newSource">Liên kết bản gốc (nếu có)</label><input id="newSource" type="url" placeholder="https://…"><label for="newText">Nội dung *</label><textarea id="newText" placeholder="Chương I. …&#10;Điều 1. …"></textarea><div id="importPreview" style="color:var(--muted);font-size:11px"></div><div class="buttons"><button class="btn-primary" id="saveDocument">Lưu vào thư viện</button><button id="cancelImport">Hủy</button></div>`);$('#cancelImport').onclick=()=>$('#modal').close();$('#newText').oninput=()=>$('#importPreview').textContent=sections($('#newText').value).filter(s=>s.heading).length+' đề mục được nhận diện';$('#sourceFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){toast('Tệp vượt giới hạn 5 MB.');return}try{let text=await f.text();if(/\.html?$/i.test(f.name)){const parsed=new DOMParser().parseFromString(text,'text/html');parsed.querySelectorAll('script,style,iframe,object,svg').forEach(n=>n.remove());parsed.querySelectorAll('br').forEach(n=>n.replaceWith('\n'));parsed.querySelectorAll('p,div,h1,h2,h3,h4,li,tr,section').forEach(n=>n.append('\n'));text=parsed.body.textContent}$('#newText').value=text;$('#newTitle').value=f.name.replace(/\.[^.]+$/,'');$('#newText').oninput()}catch{toast('Không đọc được tệp. Hãy dùng văn bản UTF-8.')}};$('#saveDocument').onclick=()=>{const title=$('#newTitle').value.trim(),text=$('#newText').value.trim(),url=$('#newSource').value.trim();if(!title||!text){toast('Cần nhập tên và nội dung văn bản.');return}if(text.length>2000000){toast('Nội dung quá dài; giới hạn 2 triệu ký tự.');return}if(url&&!safeUrl(url)){toast('Liên kết phải bắt đầu bằng http:// hoặc https://.');return}const d={id:'doc-'+(crypto.randomUUID?crypto.randomUUID():Date.now()),title,text,code:$('#newCode').value.trim(),type:$('#newType').value,category:$('#newCategory').value,source:safeUrl(url),sample:false,importedAt:new Date().toISOString()};state.docs.push(d);const ok=save('NẠP_VĂN_BẢN',d.id);category=d.category;view='docs';$('#search').value='';$('#typeFilter').value='';$('#statusFilter').value='';$('#modal').close();renderCategories();openDoc(d.id);if(ok)toast('Đã nạp văn bản. Hãy kiểm tra lại mục lục và nội dung.')}}
function download(name,data,mime){const blob=new Blob([data],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function showExport(){showModal('Xuất & khôi phục dữ liệu',`<p>Bản sao lưu chứa văn bản, ghi chú, đánh dấu và lịch sử thao tác của trình duyệt hiện tại. Tệp HTML có thể mở độc lập, không cần internet.</p><div class="buttons"><button class="btn-primary" id="exportJSON">↓ Sao lưu JSON</button><button id="exportHTML">↓ Tải bản HTML có dữ liệu</button></div><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><label for="backupFile">Nhập bản sao lưu JSON</label><p style="font-size:12px">Bổ sung văn bản chưa có ID, giữ nội dung và ghi chú hiện có khi trùng. Tối đa 10 MB. Tài liệu sẽ được lưu trong trình duyệt này.</p><input type="file" id="backupFile" accept=".json,application/json" aria-label="Nhập bản sao lưu JSON">`);$('#exportJSON').onclick=()=>{save('XUẤT_SAO_LƯU');download('Thu_Vien_VBPL_Sao_Luu.json',JSON.stringify(state,null,2),'application/json');toast('Đã tạo tệp sao lưu JSON.')};$('#exportHTML').onclick=()=>{save('XUẤT_HTML');const clone=document.documentElement.cloneNode(true);clone.querySelector('#seed').textContent=JSON.stringify(state).replace(/</g,'\\u003c');clone.querySelector('#modal').removeAttribute('open');clone.querySelector('#modalBody').innerHTML='';clone.querySelector('#toast').style.display='none';clone.querySelector('#readerBody').innerHTML='';clone.querySelector('#search').value='';download('Thu_Vien_VBPL.html','<!DOCTYPE html>\n'+clone.outerHTML,'text/html;charset=utf-8');toast('Đã tạo bản HTML độc lập có dữ liệu.')};$('#backupFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>10*1024*1024){toast('Bản sao lưu vượt giới hạn 10 MB.');return}try{const data=sanitizeState(JSON.parse(await f.text()));const incoming=data.docs.filter(d=>!state.docs.some(x=>x.id===d.id));const unique=[...new Map(incoming.map(d=>[d.id,d])).values()];state.docs.push(...unique);const ids=new Set(state.docs.map(d=>d.id));state.bookmarks=[...new Set([...state.bookmarks,...data.bookmarks.filter(id=>ids.has(id))])];for(const [id,note]of Object.entries(data.notes)){if(ids.has(id)&&typeof note==='string'&&!Object.hasOwn(state.notes,id))state.notes[id]=note}const ok=save('NHẬP_SAO_LƯU');renderCategories();renderList();$('#modal').close();if(current)openDoc(current);if(ok)toast('Đã bổ sung '+unique.length+' văn bản; giữ nguyên các ID đã có.')}catch{toast('Tệp không đúng định dạng sao lưu của ứng dụng.')}}}
function showHelp(){showModal('Hướng dẫn sử dụng',`<p><strong>Tra cứu theo ba bước:</strong> chọn lĩnh vực → chọn văn bản → chọn mục trong mục lục.</p><ul><li><b>Ctrl K:</b> tìm kiếm trong toàn thư viện.</li><li><b>M:</b> trở về mục lục. <b>D:</b> bật/tắt đánh dấu.</li><li><b>A− / A+:</b> điều chỉnh cỡ chữ nội dung.</li><li><b>Aa:</b> chuyển kiểu chữ đọc sách. <b>☾:</b> sáng/tối.</li><li><b>Xuất:</b> tải JSON sao lưu hoặc HTML độc lập.</li></ul><p>Nạp TXT, MD, HTML hoặc dán nội dung. Bản hiện tại chưa có OCR, đọc trực tiếp DOCX/PDF, phân quyền, cơ sở dữ liệu máy chủ hoặc đồng bộ nhiều thiết bị.</p><p>Dữ liệu lưu riêng theo trình duyệt. Xóa dữ liệu duyệt web có thể làm mất ghi chú và tài liệu đã nạp; hãy sao lưu định kỳ.</p><button id="readGuide" class="btn-primary">Mở hướng dẫn đầy đủ</button>`);$('#readGuide').onclick=()=>{$('#modal').close();openDoc('huong-dan')}}
function showStats(){showModal('Thống kê thư viện',`<div class="stat-grid"><div class="stat"><b>${state.docs.length}</b><span>Văn bản</span></div><div class="stat"><b>${state.docs.filter(d=>!!d.text).length}</b><span>Có nội dung</span></div><div class="stat"><b>${state.bookmarks.length}</b><span>Đánh dấu</span></div></div>${[...new Set(state.docs.map(d=>d.category))].map(c=>`<div class="stat-row"><span>${esc(c)}</span><b>${state.docs.filter(d=>d.category===c).length}</b></div>`).join('')}<p style="font-size:11px">${state.logs.length} thao tác được ghi nhận trong nhật ký cục bộ. Nhật ký có thể chỉnh sửa cùng dữ liệu trình duyệt, chưa phải bằng chứng kiểm toán chống can thiệp.</p>`)}
$('#categoryFilter').oninput=renderCategories;$('#search').oninput=()=>{view='results';renderList();mobile('list')};$('#search').onkeydown=e=>{if(e.key==='Enter'){view='results';renderList();mobile('list')}};['#typeFilter','#statusFilter','#accent'].forEach(s=>$(s).onchange=renderList);$$('[data-tab]').forEach(b=>b.onclick=()=>{view=b.dataset.tab;renderList()});$('#allDocs').onclick=()=>{category=null;view='docs';$('#search').value='';renderCategories();renderList();mobile('list')};$$('.mobile-nav [data-mobile]').forEach(b=>b.onclick=()=>mobile(b.dataset.mobile));$('#help').onclick=showHelp;$('#stats').onclick=showStats;$('#import').onclick=showImport;$('#export').onclick=showExport;$('#closeModal').onclick=()=>$('#modal').close();$('#bookmark').onclick=toggleBookmark;$('#tocBtn').onclick=()=>{if(!current){toast('Chọn một văn bản để xem mục lục.');return}$('#toc').scrollIntoView({behavior:'smooth'})};$('#print').onclick=()=>window.print();$('#copy').onclick=async()=>{const d=state.docs.find(x=>x.id===current);if(!d)return;const text=d.title+'\n'+d.code+'\nTrạng thái: Chưa xác minh pháp lý\n\n'+d.text;try{await navigator.clipboard.writeText(text);toast('Đã sao chép nội dung kèm trạng thái xác minh.')}catch{showModal('Sao chép nội dung',`<p>Trình duyệt chưa cho phép sao chép tự động. Chọn nội dung bên dưới rồi nhấn Ctrl C.</p><textarea id="copyText" readonly>${esc(text)}</textarea>`);$('#copyText').select()}};
function applyAppearance(){document.body.classList.toggle('dark',state.theme==='dark');document.body.classList.toggle('serif',state.serif);document.documentElement.style.setProperty('--readsize',state.fontSize+'px');$('#theme').textContent=state.theme==='dark'?'☀':'☾'}
$('#theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';applyAppearance();save()};$('#font').onclick=()=>{state.serif=!state.serif;applyAppearance();save()};$('#smaller').onclick=()=>{state.fontSize=Math.max(13,state.fontSize-1);applyAppearance();save();toast('Cỡ chữ nội dung: '+state.fontSize+' px')};$('#larger').onclick=()=>{state.fontSize=Math.min(24,state.fontSize+1);applyAppearance();save();toast('Cỡ chữ nội dung: '+state.fontSize+' px')};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus();return}if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||$('#modal').open||e.ctrlKey||e.metaKey)return;if(e.key.toLowerCase()==='m')$('#tocBtn').click();if(e.key.toLowerCase()==='d')toggleBookmark()});applyAppearance();renderCategories();renderList();welcome();if(loadFailed)toast('Không đọc được dữ liệu đã lưu. Đang hiển thị dữ liệu mẫu; hãy khôi phục bản sao lưu nếu có.');
</script>
